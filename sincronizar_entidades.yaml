# Esse blueprint cria uma automação para sincronizar múltiplas entidades de luz e interruptor.
# A automação é bi-direcional: se uma entidade é ligada, todas ligam. Se uma entidade é desligada, todas desligam.
# Problema conhecido: sincronizei três interruptores e uma lâmpada no mesmo blueprint, e as entidades ficaram malucas sem saber se apagavam ou acendiam.
#                     Nesse caso, recomendo criar duas automações com esse blueprint: uma para os interruptores, e uma para sincronizar um dos interruptores com a luz.
#                     Mas se for o caso de ter apenas uma luz e um interruptor, esse blueprint funciona bem.

blueprint:
  name: Sincronização de Múltiplas Entidades
  description: >
    Sincroniza dois ou mais interruptores ou luzes.
    Se uma entidade liga, todas ligam. Se uma entidade desliga, todas desligam.
    Pode misturar interruptores e luzes à vontade.
  domain: automation

  input:
    entidades:
      name: Entidades
      description: >
        Selecione pelo menos duas luzes ou interruptores que devem
        permanecer sincronizados.
      selector:
        entity:
          multiple: true
          reorder: true
          filter:
            - domain: switch
            - domain: light

variables:
  entidades: !input entidades

triggers:
  - trigger: state
    entity_id: !input entidades
    from:
      - "on"
      - "off"
    to:
      - "on"
      - "off"

conditions:
  - condition: template
    value_template: "{{ entidades | count >= 2 }}"

actions:
  - variables:
      estado_desejado: "{{ trigger.to_state.state }}"

      alvos: >
        {% set ns = namespace(entidades=[]) %}

        {% for entidade in entidades %}
          {% if
            entidade != trigger.entity_id
            and states(entidade) != estado_desejado
            and states(entidade) not in ['unknown', 'unavailable']
          %}
            {% set ns.entidades = ns.entidades + [entidade] %}
          {% endif %}
        {% endfor %}

        {{ ns.entidades }}

  - condition: template
    value_template: "{{ alvos | count > 0 }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ estado_desejado == 'on' }}"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ alvos }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_desejado == 'off' }}"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ alvos }}"

mode: queued
max: 50
max_exceeded: silent
